name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm quality:gate

      - name: Comment quality summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- watchface-quality-summary -->'
            const path = 'quality/reports/quality-summary.md'
            const body = fs.existsSync(path)
              ? `${marker}\n${fs.readFileSync(path, 'utf8')}`
              : `${marker}\n# Quality Summary\n\nNo quality summary was generated. Check the workflow logs.`

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            })
            const previous = comments.find((comment) => comment.body?.startsWith(marker))

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-reports
          path: quality/reports
          if-no-files-found: ignore
